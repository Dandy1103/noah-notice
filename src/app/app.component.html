@if (shellReady()) {
<app-header />
<div class="app">
  <app-navbar />
  <div class="shell">
    <app-sidenav />
    <main class="workspace">
      @switch (loadState()) {
        @case ('ready') { <router-outlet /> }
        @case ('loading') { <p role="status">正在載入公告…</p> }
        @case ('login') {
          <dialog
            #loginDialog
            class="login-dialog"
            aria-labelledby="login-title"
            (cancel)="$event.preventDefault()"
          >
            <h1 id="login-title">登入逾時請重新登入</h1>
            <a class="login-action" href="/oauth2/authorization/noah" (click)="rememberPage()" autofocus>重新登入</a>
          </dialog>
        }
        @case ('forbidden') { <p role="alert">你的帳號無法使用公告。請聯絡人資確認員工資料。</p> }
        @case ('error') {
          <p role="alert">公告載入失敗。</p>
          <button type="button" (click)="retry()">重新載入</button>
        }
      }
    </main>
  </div>
</div>
} @else {
  <noah-loading-mask />
}
